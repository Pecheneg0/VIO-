# Параметры VIO системы
imu:
  update_rate: 200.0  # Гц
  acceleration_noise_density: 0.01
  acceleration_random_walk: 0.001
  gyroscope_noise_density: 0.001
  gyroscope_random_walk: 0.0001
  gravity_magnitude: 9.81
  
camera:
  resolution: [640, 480]
  fps: 30
  intrinsic_params:
    fx: 525.0
    fy: 525.0
    cx: 319.5
    cy: 239.5
  distortion_coeffs: [0.1, -0.2, 0.001, 0.001, 0.0]
  
vio:
  quality_threshold: 0.7
  min_feature_count: 100
  max_feature_count: 200
  frame_rate: 30
