%YAML:1.0
# estimator_config.yaml
# Правильная структура для ov_plane
# Помещён в ~/catkin_ws_ov_plane/src/vio_integration/config/real_world/estimator_config.yaml

verbosity: "INFO"

# ==================================================================
# ПАРАМЕТРЫ КАМЕРЫ
# ==================================================================
cam0:
  camera_model: "pinhole"
  # ЗАМЕНИТЕ НА ВАШИ КАЛИБРОВОЧНЫЕ ПАРАМЕТРЫ!
  # Пример для 320x240 (проверьте реальные значения!)
  intrinsics: [320.0, 320.0, 160.0, 120.0] # [fx, fy, cx, cy]
  distortion_model: "radtan"
  # ЗАМЕНИТЕ НА ВАШИ КОЭФФИЦИЕНТЫ ДИСТОРСИИ!
  distortion_coeffs: [0.1, -0.2, 0.001, 0.001] # [k1, k2, p1, p2]
  num_features: 150
  # ВАЖНО: Установите "global", если ваша камера поддерживает
  shutter_type: "global" # КРИТИЧНО для VIO
  fps: 15.0

# ==================================================================
# ПАРАМЕТРЫ IMU
# ==================================================================
imu0:
  # ЗАМЕНИТЕ НА ШУМЫ ИЗ DATASHEET ИЛИ КАЛИБРОВКИ!
  acc_noise_density: 0.004 # Пример из datasheet MPU6050
  gyro_noise_density: 0.0004 # Пример из datasheet MPU6050
  acc_random_walk: 0.001 # Пример из datasheet MPU6050
  gyro_random_walk: 0.00001 # Пример из datasheet MPU6050
  update_rate: 200.0 # Частота вашего IMU

# ==================================================================
# ПАРАМЕТРЫ ФИЛЬТРА
# ==================================================================
max_clone_size: 11
max_slam_features: 0 # ov_plane фокусируется на плоскостях
max_cameras: 1
feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "GLOBAL_3D"

# ==================================================================
# ПАРАМЕТРЫ ПЛОСКОСТИ (КЛЮЧЕВОЕ ДЛЯ ov_plane)
# ==================================================================
use_plane_constraint: true
use_plane_constraint_msckf: true
use_plane_constraint_slamu: true
use_plane_constraint_slamd: true
use_plane_slam_feats: false # Обычно false, если max_slam = 0
use_refine_plane_feat: true
sigma_constraint: 0.010
const_init_multi: 1.0
const_init_chi2: 1.0
max_msckf_plane: 20

# ==================================================================
# ПАРАМЕТРЫ ИНИЦИАЛИЗАЦИИ
# ==================================================================
init_window_time: 3.0
init_imu_thresh: 1.45
init_max_disparity: 4.0
init_max_features: 75

# ==================================================================
# ПАРАМЕТРЫ ФРОНТЕНДА (KLT)
# ==================================================================
use_klt: true
num_pts: 150
fast_threshold: 20
grid_x: 10
grid_y: 8
min_px_dist: 15
knn_ratio: 0.70
track_frequency: 15.0
downsample_cameras: false
num_opencv_threads: 2
histogram_method: "HISTOGRAM"

# ==================================================================
# ПАРАМЕТРЫ СИНХРОНИЗАЦИИ (опционально)
# ==================================================================
# sync:
#   max_delay: 0.05
#   drop_messages: true

# ==================================================================
# ЗАПИСЬ ДАННЫХ (опционально)
# ==================================================================
# record_timing_information: false
# record_timing_filepath: "/tmp/traj_timing.txt"
# record_plane_tracking_information: false
# record_plane_tracking_filepath: "/tmp/traj_tracking.txt"
# save_total_state: false
# filepath_est: "/tmp/ov_estimate.txt"
# filepath_std: "/tmp/ov_estimate_std.txt"
# filepath_gt: "/tmp/ov_groundtruth.txt"

# ==================================================================
# ПАРАМЕТРЫ ZUPT (опционально)
# ==================================================================
# try_zupt: false
# zupt_chi2_multipler: 0.0
# zupt_max_velocity: 0.1
# zupt_noise_multiplier: 50
# zupt_max_disparity: 1.5
# zupt_only_at_beginning: true

# ==================================================================
# ПАРАМЕТРЫ ДИСТОРСИИ И ПОРЯДКА (для фильтрации)
# ==================================================================
# up_msckf_sigma_px: 1.0
# up_msckf_chi2_multipler: 1.0
# up_slam_sigma_px: 1.0
# up_slam_chi2_multipler: 1.0
# up_aruco_sigma_px: 1.0
# up_aruco_chi2_multipler: 1.0

# ==================================================================
# МАСКИ ИЗОБРАЖЕНИЯ (опционально)
# ==================================================================
# use_mask: false

# ==================================================================
# ОТНОСИТЕЛЬНЫЕ КОНФИГУРАЦИИ (Kalibr) - УДАЛЕНЫ, ЧТОБЫ ИЗБЕЖАТЬ ОШИБКИ
# ==================================================================
