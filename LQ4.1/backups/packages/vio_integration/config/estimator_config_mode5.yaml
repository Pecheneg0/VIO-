%YAML:1.0
# estimator_config.yaml
# Помещён в ~/catkin_ws_ov_plane/src/vio_integration/config/real_world/estimator_config.yaml
# Используется ov_plane через launch-файл

verbosity: "INFO"

# ==================================================================
# ПАРАМЕТРЫ ФИЛЬТРА
# ==================================================================
use_fej: true
use_imuavg: true
use_rk4int: false

# ==================================================================
# КАЛИБРОВКА (указываем пути к внешним файлам)
# ==================================================================
calib_cam_extrinsics: false # Установите в true, если хотите оптимизировать T_imu_cam
calib_cam_intrinsics: false # Установите в true, если хотите оптимизировать intrinsics
calib_cam_timeoffset: false # Установите в true, если нужно оптимизировать смещение времени

# УКАЗЫВАЕМ ПУТИ К ВНЕШНИМ ФАЙЛАМ КАЛИБРОВКИ
relative_config_imu: "imu0.yaml"
relative_config_imucam: "cam0.yaml"

# ==================================================================
# ПАРАМЕТРЫ СКОЛЬЗЯЩЕГО ОКНА
# ==================================================================
max_clones: 11
max_slam: 0 # 0 отключает SLAM-фичи
max_slam_in_update: 15
max_msckf_in_update: 20

# ==================================================================
# ПАРАМЕТРЫ ARUCO (если не используется)
# ==================================================================
num_aruco: 0
feat_rep_aruco: "GLOBAL_3D"

# ==================================================================
# ПАРАМЕТРЫ ПЛОСКОСТИ (Ключевые для ov_plane)
# ==================================================================
use_plane_constraint: true
use_plane_constraint_msckf: true
use_plane_constraint_slamu: false # max_slam = 0
use_plane_constraint_slamd: false # max_slam = 0
use_plane_slam_feats: false # max_slam = 0
use_refine_plane_feat: true
use_groundtruths: false

sigma_constraint: 0.010
const_init_multi: 1.00
const_init_chi2: 1.00
max_msckf_plane: 20

sigma_plane_merge: 0.01
plane_merge_chi2: 0.75
plane_merge_deg_max: 1.0

# ==================================================================
# ПАРАМЕТРЫ СБОРА ПЛОСКОСТЕЙ
# ==================================================================
plane_max_tri_side_px: 400 # max pixels a triangle edge can be
plane_max_norm_count: 12 # num tri norms to average
plane_max_norm_avg_max: 20.0 # max diff for norm average (degrees)
plane_max_norm_avg_var: 15.0 # max variance for norm average (degrees)
plane_max_norm_deg: 10.0 # pair-wise comparison
plane_max_dist_between_z: 0.05 # distance in vertical direction to plane:
plane_max_pairwise_px: 300 # max pixels pairwise comparison can be
plane_min_norms: 5 # min norms to do pair-wise comparison
plane_check_old_feats: true # update plane ids of features matched in previous frame

plane_filter_num_feat: 8 # we only perform spacial filtering if more than this feat count
plane_filter_z_thresh: 1.5 # z-test threshold (probably should be > 1.0) https://www.simplypsychology.org/z-table.html
plane_collect_init_feats: true
plane_collect_msckf_feats: true
plane_init_min_feat: 10
plane_init_max_cond: 50.0
plane_msckf_min_feat: 8
plane_msckf_max_cond: 50.0

# ==================================================================
# ПАРАМЕТРЫ ИНИЦИАЛИЗАЦИИ
# ==================================================================
init_window_time: 3.0
init_imu_thresh: 1.45
init_max_disparity: 4.0
init_max_features: 75

init_dyn_use: false # Установите в true, если нужна динамическая инициализация
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_threads: 6
init_dyn_mle_max_time: 0.05
init_dyn_num_pose: 6
init_dyn_min_deg: 10.0
init_dyn_inflation_ori: 10.0
init_dyn_inflation_vel: 100.0
init_dyn_inflation_bg: 10.0
init_dyn_inflation_ba: 100.0
init_dyn_min_rec_cond: 1e-12
init_dyn_bias_g: [0.0, 0.0, 0.0] # [gx, gy, gz] (rad/s)
init_dyn_bias_a: [0.0, 0.0, 0.0] # [ax, ay, az] (m/s^2)

# ==================================================================
# ПАРАМЕТРЫ ЗАПИСИ (опционально)
# ==================================================================
record_timing_information: false
record_timing_filepath: "/tmp/traj_timing.txt"
record_plane_tracking_information: false
record_plane_tracking_filepath: "/tmp/traj_tracking.txt"
save_total_state: false
filepath_est: "/tmp/ov_estimate.txt"
filepath_std: "/tmp/ov_estimate_std.txt"
filepath_gt: "/tmp/ov_groundtruth.txt"

# ==================================================================
# ПАРАМЕТРЫ ФРОНТЕНДА (KLT)
# ==================================================================
use_klt: true
num_pts: 150
fast_threshold: 20
grid_x: 10
grid_y: 8
min_px_dist: 15
knn_ratio: 0.70
track_frequency: 15.0
downsample_cameras: false
num_opencv_threads: 2
histogram_method: "HISTOGRAM"

# ==================================================================
# ПАРАМЕТРЫ ZUPT (опционально)
# ==================================================================
try_zupt: false
zupt_chi2_multipler: 0.0
zupt_max_velocity: 0.1
zupt_noise_multiplier: 50
zupt_max_disparity: 1.5
zupt_only_at_beginning: true


# aruco tag tracker for the system
# DICT_6X6_1000 from https://chev.me/arucogen/
use_aruco: false
num_aruco: 1024
downsize_aruco: true


# ==================================================================
# ПАРАМЕТРЫ ДИСТОРСИИ И ПОРЯДКА (для фильтрации)
# ==================================================================
up_msckf_sigma_px: 1.0
up_msckf_chi2_multipler: 1.0
up_slam_sigma_px: 1.0
up_slam_chi2_multipler: 1.0
up_aruco_sigma_px: 1.0
up_aruco_chi2_multipler: 1.0

# ==================================================================
# МАСКИ ИЗОБРАЖЕНИЯ (опционально)
# ==================================================================
use_mask: false

# ==================================================================
# ГРАВИТАЦИЯ
# ==================================================================
gravity_mag: 9.81

# ==================================================================
# ПРЕДСТАВЛЕНИЕ ФИЧ
# ==================================================================
feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "GLOBAL_3D"
feat_rep_aruco: "GLOBAL_3D"

# ==================================================================
# МАКСИМАЛЬНОЕ КОЛИЧЕСТВО КАМЕР
# ==================================================================
max_cameras: 1

# ==================================================================
# МАКСИМАЛЬНОЕ КОЛИЧЕСТВО КАМЕР
# ==================================================================
use_stereo: false

# ==================================================================
# ОСТАЛЬНЫЕ ПАРАМЕТРЫ (если нужны)
# ==================================================================

cam0:
  camera_model: pinhole
  # ЗАМЕНИТЕ НА ВАШИ КАЛИБРОВОЧНЫЕ ПАРАМЕТРЫ!
  intrinsics: [320.0, 320.0, 160.0, 120.0] # [fx, fy, cx, cy] для 320x240
  distortion_model: radtan
  # ЗАМЕНИТЕ НА ВАШИ КОЭФФИЦИЕНТЫ ДИСТОРСИИ!
  distortion_coeffs: [0.1, -0.2, 0.001, 0.001] # [k1, k2, p1, p2]
  num_features: 150
  shutter_type: "rolling" # КРИТИЧНО для VIO
  fps: 15.0
  resolution: [320, 240] # [width, height]
  rostopic: /data

imu0:

  # ЗАМЕНИТЕ НА ШУМЫ ИЗ DATASHEET ИЛИ КАЛИБРОВКИ!
  accelerometer_noise_density: 0.004 # Пример из datasheet MPU6050
  gyroscope_noise_density: 0.0004 # Пример из datasheet MPU6050
  accelerometer_random_walk: 0.001 # Пример из datasheet MPU6050
  gyroscope_random_walk: 0.00001 # Пример из datasheet MPU6050
  model: calibrated
  rostopic: /imu/data
  time_offset: 0.0
  update_rate: 200.0 # Частота вашего IMU
# dt_slam_delay: 2.0
# ... (остальные параметры по необходимости)
